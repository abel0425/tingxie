<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>听写神器 · 单词/词组朗读</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #eef1f7;
    color: #1e2330;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-columns: 380px minmax(0, 1fr);
    gap: 14px;
    height: 100vh;
    padding: 14px;
    max-width: 1440px;
    margin: 0 auto;
  }

  /* ---------- 侧栏 ---------- */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .brand h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: .5px;
  }
  .brand p {
    margin: 0;
    font-size: 12.5px;
    color: #7a839a;
    line-height: 1.5;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 2px 12px rgba(20, 30, 60, .06);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  textarea {
    width: 100%;
    height: 190px;
    resize: vertical;
    border: 1px solid #dfe4ef;
    border-radius: 10px;
    padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #2b3245;
    background: #fafbff;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus {
    border-color: #8aa8f7;
    box-shadow: 0 0 0 3px rgba(59, 111, 245, .12);
  }

  .row { display: flex; flex-direction: column; gap: 5px; }
  .row > label {
    font-size: 12.5px;
    color: #6b7488;
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .row > label .val { color: #3b6ff5; font-variant-numeric: tabular-nums; }

  select, input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #dfe4ef;
    border-radius: 9px;
    font-size: 13px;
    color: #2b3245;
    background: #fff;
    font-family: inherit;
    outline: none;
  }
  select:focus, input[type="number"]:focus { border-color: #8aa8f7; }

  input[type="range"] {
    width: 100%;
    accent-color: #3b6ff5;
    height: 20px;
  }

  .check label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #4a5268;
    cursor: pointer;
  }
  .check input { width: 16px; height: 16px; accent-color: #3b6ff5; cursor: pointer; }

  /* ---------- 按钮 ---------- */
  .btn {
    border: 1px solid #d3d9e6;
    background: #fff;
    color: #2b3245;
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, border-color .15s, transform .05s;
    white-space: nowrap;
  }
  .btn:hover { background: #f2f5fc; border-color: #b9c4da; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: #3b6ff5; border-color: #3b6ff5; color: #fff; }
  .btn.primary:hover { background: #2f5fe0; }
  .btn.block { width: 100%; }

  /* ---------- 主区 ---------- */
  .main {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    background: #fff;
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 2px 12px rgba(20, 30, 60, .06);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  #playBtn {
    min-width: 116px;
    font-size: 15px;
    font-weight: 600;
    background: #3b6ff5;
    border-color: #3b6ff5;
    color: #fff;
  }
  #playBtn:hover { background: #2f5fe0; }
  #playBtn.playing {
    background: #fff;
    color: #e05a3b;
    border-color: #f0b6a8;
  }
  #playBtn.playing:hover { background: #fff5f2; }

  .progress {
    margin-left: auto;
    color: #7a839a;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    border-top: 1px solid #eef1f7;
    padding-top: 8px;
  }

  .item {
    display: grid;
    grid-template-columns: 42px 1fr;
    grid-template-areas: "num en" "num zh";
    gap: 1px 10px;
    padding: 9px 12px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .12s, border-color .12s;
  }
  .item:hover { background: #f4f7fd; }
  .item.active {
    background: #e9f0ff;
    border-color: #bfd2fb;
    box-shadow: inset 3px 0 0 #3b6ff5;
  }
  .item .num {
    grid-area: num;
    color: #a4adc0;
    font-size: 12.5px;
    text-align: right;
    padding-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .item .en {
    grid-area: en;
    font-weight: 600;
    font-size: 17px;
    word-break: break-word;
    line-height: 1.35;
  }
  .item .zh {
    grid-area: zh;
    color: #6b7488;
    font-size: 13.5px;
    line-height: 1.35;
  }

  /* 遮挡答案 */
  .list.masked .item .en,
  .list.masked .item .zh {
    filter: blur(6px);
    cursor: pointer;
    transition: filter .18s;
    user-select: none;
  }
  .list.masked .item .en:hover,
  .list.masked .item .zh:hover {
    filter: blur(0);
  }

  .empty {
    text-align: center;
    color: #a4adc0;
    padding: 40px 0;
    font-size: 14px;
  }

  /* 提示条 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: #2b3245;
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d3dae8; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #bcc6d9; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 880px) {
    .app {
      grid-template-columns: 1fr;
      height: auto;
      min-height: 100vh;
    }
    .sidebar { overflow: visible; }
    .main { min-height: 70vh; }
    .list { max-height: 55vh; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ 左侧 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <h1>🎧 听写神器</h1>
      <p>粘贴词表 → 一键朗读。单词读英文 ×3，词组读中文 ×3（可切换模式）。</p>
    </div>

    <div class="card">
      <textarea id="input" spellcheck="false" placeholder="每行一条：英文 + 中文&#10;例如：&#10;alert 警报&#10;pose a risk 造成威胁"></textarea>
      <button id="loadBtn" class="btn primary block">载入词表（Ctrl + Enter）</button>
    </div>

    <div class="card">
      <div class="row">
        <label for="mode">朗读模式</label>
        <select id="mode">
          <option value="auto">自动 · 单词读英文 / 词组读中文</option>
          <option value="en">只读英文</option>
          <option value="zh">只读中文</option>
          <option value="en-zh">英文 ×N ＋ 中文 ×1</option>
          <option value="zh-en">中文 ×N ＋ 英文 ×1</option>
        </select>
      </div>

      <div class="row">
        <label for="repeat">每项重复次数</label>
        <input type="number" id="repeat" min="1" max="10" value="3" />
      </div>

      <div class="row">
        <label for="rate">语速 <span class="val" id="rateVal">1.0</span></label>
        <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1" />
      </div>

      <div class="row">
        <label for="gap">重复间隔 <span class="val" id="gapVal">0.6s</span></label>
        <input type="range" id="gap" min="0" max="3" step="0.1" value="0.6" />
      </div>

      <div class="row">
        <label for="pause">词间停顿 <span class="val" id="pauseVal">1.5s</span></label>
        <input type="range" id="pause" min="0" max="10" step="0.5" value="1.5" />
      </div>

      <div class="row">
        <label for="enVoice">英文语音</label>
        <select id="enVoice"></select>
      </div>

      <div class="row">
        <label for="zhVoice">中文语音</label>
        <select id="zhVoice"></select>
      </div>

      <div class="row check">
        <label><input type="checkbox" id="hideAns" /> 隐藏答案（鼠标悬停显示）</label>
      </div>
    </div>
  </aside>

  <!-- ============ 右侧 ============ -->
  <main class="main">
    <div class="toolbar">
      <button id="playBtn" class="btn">▶ 播放</button>
      <button id="prevBtn" class="btn">⏮ 上一项</button>
      <button id="nextBtn" class="btn">下一项 ⏭</button>
      <button id="resetBtn" class="btn">↺ 重置</button>
      <span class="progress" id="progress">0 / 0</span>
    </div>
    <ul class="list" id="list">
      <li class="empty">还没有词表，请在左侧粘贴后点击「载入词表」</li>
    </ul>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ---------------- 工具 ---------------- */
  const $ = (s, r = document) => r.querySelector(s);
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const esc = (s) => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const els = {
    input: $('#input'),
    loadBtn: $('#loadBtn'),
    mode: $('#mode'),
    repeat: $('#repeat'),
    rate: $('#rate'),
    rateVal: $('#rateVal'),
    gap: $('#gap'),
    gapVal: $('#gapVal'),
    pause: $('#pause'),
    pauseVal: $('#pauseVal'),
    enVoice: $('#enVoice'),
    zhVoice: $('#zhVoice'),
    hideAns: $('#hideAns'),
    playBtn: $('#playBtn'),
    prevBtn: $('#prevBtn'),
    nextBtn: $('#nextBtn'),
    resetBtn: $('#resetBtn'),
    progress: $('#progress'),
    list: $('#list'),
    toast: $('#toast')
  };

  /* ---------------- 状态 ---------------- */
  let items = [];          // [{en, zh}]
  let index = 0;
  let playing = false;
  let finished = false;
  let token = 0;           // 每次停止/重播自增，用来作废旧循环
  let sleepResolvers = [];

  /* ---------------- 提示 ---------------- */
  let toastTimer = null;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2000);
  }

  /* ---------------- 解析词表 ---------------- */
  const CJK_RE = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/;

  function parseText(text) {
    const out = [];
    text.split(/\r?\n/).forEach(raw => {
      let line = String(raw).replace(/\t/g, '  ').trim();
      if (!line) return;

      // 去掉行首序号： "1. " / "1) " / "1、"
      line = line.replace(/^\d+\s*[.、)\]]\s*/, '');

      const m = line.match(CJK_RE);
      let en = line, zh = '';
      if (m) {
        const i = line.indexOf(m[0]);
        en = line.slice(0, i);
        zh = line.slice(i);
      }

      en = en.replace(/[\s,，;；:：]+/g, ' ').trim();
      zh = zh.replace(/\s+/g, ' ').trim();

      if (!en && !zh) return;
      out.push({ en, zh });
    });
    return out;
  }

  function isPhrase(en) {
    return en.trim().split(/\s+/).filter(Boolean).length > 1;
  }

  /* ---------------- 语音 ---------------- */
  const synthOK = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);

  function refreshVoiceLists() {
    if (!synthOK) return;
    const all = speechSynthesis.getVoices();
    if (!all.length) return;

    const enList = all.filter(v => /^en/i.test(v.lang));
    const zhList = all.filter(v => /^zh/i.test(v.lang));

    fillVoiceSelect(els.enVoice, enList, ['en-us', 'en-gb', 'en']);
    fillVoiceSelect(els.zhVoice, zhList, ['zh-cn', 'zh-tw', 'zh-hk', 'zh']);
  }

  function fillVoiceSelect(sel, list, prefs) {
    const prev = sel.value;
    sel.innerHTML = '';

    if (!list.length) {
      const o = document.createElement('option');
      o.value = '';
      o.textContent = '（无可用语音）';
      sel.appendChild(o);
      return;
    }

    list.forEach(v => {
      const o = document.createElement('option');
      o.value = v.voiceURI;
      o.textContent = v.name + ' · ' + v.lang;
      sel.appendChild(o);
    });

    let target = list.find(v => v.voiceURI === prev);
    if (!target) {
      for (const p of prefs) {
        target = list.find(v => v.lang.toLowerCase().replace('_', '-').startsWith(p));
        if (target) break;
      }
    }
    sel.value = (target || list[0]).voiceURI;
  }

  function getVoice(sel) {
    if (!synthOK) return null;
    const uri = sel.value;
    if (!uri) return null;
    return speechSynthesis.getVoices().find(v => v.voiceURI === uri) || null;
  }

  /* ---------------- 朗读 ---------------- */
  function speakOnce(text, lang) {
    return new Promise(resolve => {
      if (!synthOK || !text) return resolve();

      const u = new SpeechSynthesisUtterance(text);
      const v = getVoice(lang === 'en' ? els.enVoice : els.zhVoice);
      if (v) u.voice = v;
      u.lang = v ? v.lang : (lang === 'en' ? 'en-US' : 'zh-CN');
      u.rate = parseFloat(els.rate.value) || 1;
      u.pitch = 1;
      u.volume = 1;

      let settled = false;
      let timer = null;

      const done = () => {
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        resolve();
      };

      u.onend = done;
      u.onerror = done;

      // 兜底：某些浏览器 onend 不触发
      const est = 900 + text.length * (lang === 'en' ? 180 : 320) / u.rate;
      timer = setTimeout(done, est);

      try {
        speechSynthesis.speak(u);
      } catch (e) {
        done();
      }
    });
  }

  /* ---------------- 可取消的 sleep ---------------- */
  function sleep(ms) {
    if (ms <= 0) return Promise.resolve();
    return new Promise(resolve => {
      const id = setTimeout(() => {
        sleepResolvers = sleepResolvers.filter(r => r !== resolve);
        resolve();
      }, ms);
      sleepResolvers.push(resolve);
    });
  }

  function cancelSleeps() {
    const rs = sleepResolvers;
    sleepResolvers = [];
    rs.forEach(r => r());
  }

  /* ---------------- 构建朗读步骤 ---------------- */
  function buildSteps(item) {
    const n = clamp(parseInt(els.repeat.value, 10) || 3, 1, 10);
    const mode = els.mode.value;
    const en = (item.en || '').trim();
    const zh = (item.zh || '').trim();

    let plan; // [[lang, count], ...]

    switch (mode) {
      case 'en':
        plan = [['en', n]];
        break;
      case 'zh':
        plan = [['zh', n]];
        break;
      case 'en-zh':
        plan = [['en', n], ['zh', 1]];
        break;
      case 'zh-en':
        plan = [['zh', n], ['en', 1]];
        break;
      default: // auto
        if (!en) plan = [['zh', n]];
        else if (isPhrase(en)) plan = zh ? [['zh', n]] : [['en', n]];
        else plan = [['en', n]];
    }

    const steps = [];
    plan.forEach(([lang, count]) => {
      const text = lang === 'en' ? en : zh;
      if (!text) return;
      for (let i = 0; i < count; i++) steps.push({ text, lang });
    });
    return steps;
  }

  /* ---------------- 渲染 ---------------- */
  function renderList() {
    els.list.innerHTML = '';

    if (!items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '还没有词表，请在左侧粘贴后点击「载入词表」';
      els.list.appendChild(li);
      return;
    }

    const frag = document.createDocumentFragment();
    items.forEach((it, i) => {
      const li = document.createElement('li');
      li.className = 'item' + (i === index ? ' active' : '');
      li.dataset.i = i;
      li.innerHTML =
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="en">' + esc(it.en || '—') + '</span>' +
        '<span class="zh">' + esc(it.zh || '') + '</span>';
      li.addEventListener('click', () => startPlayback(i));
      frag.appendChild(li);
    });
    els.list.appendChild(frag);
  }

  function renderActive() {
    const kids = els.list.children;
    for (let i = 0; i < kids.length; i++) {
      kids[i].classList.toggle('active', i === index);
    }
    const cur = kids[index];
    if (cur && cur.scrollIntoView) {
      cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function updateProgress() {
    if (!items.length) {
      els.progress.textContent = '0 / 0';
      return;
    }
    const shown = clamp(index + 1, 1, items.length);
    els.progress.textContent = shown + ' / ' + items.length;
  }

  function updatePlayBtn() {
    els.playBtn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
    els.playBtn.classList.toggle('playing', playing);
  }

  /* ---------------- 播放控制 ---------------- */
  function stopAll() {
    token++;
    cancelSleeps();
    if (synthOK) {
      try { speechSynthesis.cancel(); } catch (e) {}
    }
    playing = false;
    updatePlayBtn();
  }

  async function startPlayback(from) {
    if (!items.length) {
      toast('请先载入词表');
      return;
    }
    if (!synthOK) {
      toast('当前浏览器不支持语音合成');
      return;
    }

    stopAll();

    finished = false;
    index = clamp(from, 0, items.length - 1);
    const myToken = token;

    playing = true;
    updatePlayBtn();
    renderActive();
    updateProgress();

    const gapMs = () => (parseFloat(els.gap.value) || 0) * 1000;
    const pauseMs = () => (parseFloat(els.pause.value) || 0) * 1000;

    for (let i = index; i < items.length; i++) {
      if (myToken !== token) return;

      index = i;
      renderActive();
      updateProgress();

      const steps = buildSteps(items[i]);
      for (let s = 0; s < steps.length; s++) {
        if (myToken !== token) return;
        await speakOnce(steps[s].text, steps[s].lang);
        if (myToken !== token) return;
        if (s < steps.length - 1) await sleep(gapMs());
      }

      if (myToken !== token) return;
      if (i < items.length - 1) await sleep(pauseMs());
    }

    if (myToken === token) {
      playing = false;
      finished = true;
      index = items.length - 1;
      updatePlayBtn();
      renderActive();
      updateProgress();
    }
  }

  function togglePlay() {
    if (playing) {
      stopAll();
      return;
    }
    startPlayback(finished ? 0 : index);
  }

  /* ---------------- 载入 ---------------- */
  function loadList() {
    stopAll();
    const parsed = parseText(els.input.value);

    if (!parsed.length) {
      toast('没有解析到内容，请检查格式：每行「英文 + 中文」');
      return;
    }

    items = parsed;
    index = 0;
    finished = false;
    renderList();
    updateProgress();
    updatePlayBtn();
    toast('已载入 ' + items.length + ' 条');
  }

  /* ---------------- 事件绑定 ---------------- */
  els.loadBtn.addEventListener('click', loadList);

  els.input.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      loadList();
    }
  });

  els.playBtn.addEventListener('click', togglePlay);

  els.prevBtn.addEventListener('click', () => {
    if (!items.length) return;
    startPlayback(Math.max(0, (finished ? items.length : index) - 1));
  });

  els.nextBtn.addEventListener('click', () => {
    if (!items.length) return;
    startPlayback(Math.min(items.length - 1, index + 1));
  });

  els.resetBtn.addEventListener('click', () => {
    stopAll();
    index = 0;
    finished = false;
    renderActive();
    updateProgress();
  });

  els.rate.addEventListener('input', () => {
    els.rateVal.textContent = parseFloat(els.rate.value).toFixed(1);
  });
  els.gap.addEventListener('input', () => {
    els.gapVal.textContent = parseFloat(els.gap.value).toFixed(1) + 's';
  });
  els.pause.addEventListener('input', () => {
    els.pauseVal.textContent = parseFloat(els.pause.value).toFixed(1) + 's';
  });

  els.hideAns.addEventListener('change', () => {
    els.list.classList.toggle('masked', els.hideAns.checked);
  });

  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toUpperCase();
    if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;

    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      if (items.length) startPlayback(Math.min(items.length - 1, index + 1));
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      if (items.length) startPlayback(Math.max(0, index - 1));
    } else if (e.key === 'Escape') {
      stopAll();
    }
  });

  /* ---------------- 初始化 ---------------- */
  const SAMPLE = [
    'alert          警报',
    'normally       正常地',
    'detect         检测',
    'decision       决策',
    'risky          有风险的',
    'threaten       威胁',
    'critic         评论家',
    'simplistic     片面的',
    'sugar-coated   过度美化的',
    'seminar        讨论会',
    'counterpart    原形',
    'significant    显著的',
    'eventually     最终',
    'feature        以…为特色',
    'reception      反应、评价',
    'pose a risk    造成威胁',
    'present a threat to  对…造成威胁',
    'work out       想出，理解',
    'eat away at    侵蚀',
    'make sure      确保',
    'have a taste for...  感兴趣',
    'cultural heritage    文化遗产',
    'run out of     用尽',
    'free-spirited 无拘无束的',
    'box office     票房',
    'a warm reminder of   温馨地唤起',
    'spring festival gala 春晚'
  ].join('\n');

  function init() {
    els.input.value = SAMPLE;

    // 语音列表
    if (synthOK) {
      refreshVoiceLists();
      if (typeof speechSynthesis.addEventListener === 'function') {
        speechSynthesis.addEventListener('voiceschanged', refreshVoiceLists);
      } else {
        speechSynthesis.onvoiceschanged = refreshVoiceLists;
      }
      // 部分浏览器需要稍等才有语音列表
      setTimeout(refreshVoiceLists, 300);
      setTimeout(refreshVoiceLists, 1200);
    } else {
      toast('当前浏览器不支持语音合成，请使用 Chrome / Edge');
    }

    // 自动载入示例
    items = parseText(els.input.value);
    renderList();
    updateProgress();
    updatePlayBtn();
  }

  init();
})();
</script>
